<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PTE Collocations</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#f0f2f8;color:#1a1a2e;min-height:100vh}
header{background:#1e2a78;color:#fff;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
header h1{font-size:17px;font-weight:700;letter-spacing:.3px}
header span{font-size:12px;color:#a5b4fc}
.tabs{background:#fff;border-bottom:2px solid #e5e7eb;display:flex;padding:0 24px;gap:4px}
.tab{padding:13px 22px;cursor:pointer;font-size:13px;font-weight:600;color:#6b7280;border-bottom:3px solid transparent;margin-bottom:-2px;transition:.15s}
.tab:hover{color:#1e2a78}
.tab.active{color:#1e2a78;border-bottom-color:#1e2a78}
.content{max-width:940px;margin:0 auto;padding:22px 20px}
.controls{display:flex;gap:10px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
.controls label{font-size:13px;font-weight:600;color:#374151}
select,input[type=text]{padding:8px 12px;border:1.5px solid #d1d5db;border-radius:8px;font-size:13px;background:#fff;color:#111;cursor:pointer;outline:none;transition:border .15s}
select:focus,input[type=text]:focus{border-color:#1e2a78}
input[type=text]{flex:1;min-width:180px}
.badge{font-size:12px;color:#6b7280;margin-left:4px}

/* LIST */
.cat-group{margin-bottom:26px}
.cat-label{font-size:11px;font-weight:700;color:#1e2a78;text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px;padding-bottom:5px;border-bottom:1.5px solid #e0e4f7}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:8px}
.col-card{background:#fff;border:1px solid #e5e7eb;border-radius:9px;padding:11px 14px;transition:box-shadow .15s}
.col-card:hover{box-shadow:0 2px 10px rgba(30,42,120,.1)}
.col-word{font-size:14px;font-weight:700;color:#1a1a2e}
.col-word em{color:#1e2a78;font-style:normal}
.col-ex{font-size:11.5px;color:#6b7280;margin-top:4px;line-height:1.5;font-style:italic}
.no-results{text-align:center;color:#9ca3af;padding:50px;font-size:14px}

/* FLASHCARD */
.fc-wrap{display:flex;flex-direction:column;align-items:center;padding-top:10px}
.fc-progress{font-size:12px;color:#9ca3af;margin-bottom:12px}
.fc-card{width:100%;max-width:560px;min-height:210px;background:#fff;border-radius:16px;border:2px solid #e5e7eb;padding:36px 32px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:border-color .2s,box-shadow .2s;position:relative;user-select:none}
.fc-card:hover{border-color:#1e2a78;box-shadow:0 4px 18px rgba(30,42,120,.12)}
.fc-hint{font-size:11px;color:#d1d5db;position:absolute;bottom:14px;right:18px}
.fc-front{text-align:center}
.fc-front .word{font-size:28px;font-weight:800;color:#1a1a2e;letter-spacing:.3px}
.fc-front .word em{color:#1e2a78;font-style:normal}
.fc-front .sub{font-size:12px;color:#9ca3af;margin-top:8px}
.fc-back{display:none;text-align:center}
.fc-tag{display:inline-block;background:#e8eaf6;color:#1e2a78;font-size:11px;font-weight:600;padding:3px 10px;border-radius:12px;margin-bottom:12px}
.fc-back .ex{font-size:15px;color:#374151;line-height:1.8;font-style:italic}
.fc-card.flipped .fc-front{display:none}
.fc-card.flipped .fc-back{display:block}
.fc-btns{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap;justify-content:center}

/* QUIZ */
.quiz-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
.stat{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:12px 8px;text-align:center}
.stat-val{font-size:24px;font-weight:800;color:#1e2a78}
.stat-val.streak{color:#f59e0b}
.stat-val.correct-col{color:#22c55e}
.stat-val.wrong-col{color:#ef4444}
.stat-lbl{font-size:10px;color:#9ca3af;margin-top:2px;text-transform:uppercase;letter-spacing:.5px}
.streak-msg{text-align:center;font-size:13px;font-weight:600;color:#f59e0b;margin-bottom:12px;min-height:20px}
.q-card{background:#fff;border:2px solid #e5e7eb;border-radius:14px;padding:26px}
.q-num{font-size:11px;color:#9ca3af;margin-bottom:5px}
.q-text{font-size:17px;font-weight:700;color:#1a1a2e;margin-bottom:4px}
.q-text span{background:#e8eaf6;color:#1e2a78;padding:1px 5px;border-radius:4px}
.q-cat{font-size:11px;color:#9ca3af;margin-bottom:20px}
.options{display:flex;flex-direction:column;gap:9px}
.opt{padding:13px 16px;border:2px solid #e5e7eb;border-radius:9px;cursor:pointer;font-size:14px;font-weight:500;color:#374151;text-align:left;background:#fff;width:100%;transition:.12s}
.opt:hover:not(:disabled){border-color:#1e2a78;color:#1e2a78;background:#f0f2ff}
.opt.correct{border-color:#22c55e!important;background:#f0fdf4!important;color:#166534!important;font-weight:600}
.opt.wrong{border-color:#ef4444!important;background:#fef2f2!important;color:#991b1b!important}
.opt:disabled{cursor:default}
.feedback{border-radius:9px;padding:14px 16px;margin-top:10px;font-size:13px;line-height:1.7;display:none}
.feedback.show{display:block}
.feedback.fc-correct{background:#f0fdf4;border:1px solid #bbf7d0;color:#166534}
.feedback.fc-wrong{background:#fef2f2;border:1px solid #fecaca;color:#7f1d1d}
.feedback strong{display:block;margin-bottom:4px;font-size:13.5px}
.feedback em{font-size:12.5px;color:#555;font-style:italic}
.next-btn{margin-top:16px;width:100%}
.end-screen{text-align:center;padding:50px 20px;background:#fff;border-radius:16px}
.end-screen h2{font-size:22px;font-weight:800;margin-bottom:6px}
.final{font-size:56px;font-weight:900;color:#1e2a78;line-height:1}
.final-sub{font-size:14px;color:#6b7280;margin:10px 0 28px}

/* BUTTONS */
.btn{padding:9px 20px;border-radius:8px;border:none;cursor:pointer;font-size:13px;font-weight:600;transition:.15s}
.btn-primary{background:#1e2a78;color:#fff}
.btn-primary:hover{background:#16205e}
.btn-secondary{background:#fff;color:#374151;border:1.5px solid #d1d5db}
.btn-secondary:hover{background:#f9fafb}
.btn-success{background:#22c55e;color:#fff}
.btn-success:hover{background:#16a34a}

@media(max-width:600px){
  .quiz-stats{grid-template-columns:repeat(2,1fr)}
  .fc-front .word{font-size:22px}
}

/* MEANING QUIZ */
.q-meaning{font-size:15px;font-style:italic;color:#1e2a78;margin-bottom:16px;padding:10px 14px;background:#f0f2ff;border-radius:8px;border-left:3px solid #1e2a78}

/* PASSAGE FIB */
.passage-controls{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.toggle-group{display:flex;border:1.5px solid #d1d5db;border-radius:8px;overflow:hidden}
.toggle-btn{padding:7px 14px;font-size:12.5px;font-weight:600;background:#fff;color:#6b7280;cursor:pointer;border:none}
.toggle-btn.active{background:#1e2a78;color:#fff}
.passage-topic-tag{display:inline-block;background:#e8eaf6;color:#1e2a78;font-size:11px;font-weight:700;padding:3px 10px;border-radius:12px;margin-bottom:10px;text-transform:uppercase;letter-spacing:.4px}
.passage-hint{font-size:12px;color:#9ca3af;margin-bottom:12px;display:block}
.passage-card{background:#fff;border:2px solid #e5e7eb;border-radius:14px;padding:24px;font-size:15px;line-height:2.3;color:#1a1a2e}
.blank-drop{display:inline-block;min-width:100px;padding:3px 12px;margin:0 3px;border-bottom:2px dashed #9ca3af;border-radius:4px;background:#f9fafb;text-align:center;font-weight:700;color:#1e2a78;cursor:pointer;font-size:14px}
.blank-drop.filled{background:#eef2ff;border-bottom:2px solid #1e2a78;cursor:pointer}
.blank-drop.correct{background:#f0fdf4;border-bottom:2px solid #22c55e;color:#166534;cursor:default}
.blank-drop.wrong{background:#fef2f2;border-bottom:2px solid #ef4444;color:#991b1b;cursor:default}
select.blank-select{padding:4px 8px;border:1.5px solid #c7d2fe;border-radius:6px;font-size:13.5px;font-weight:700;color:#1e2a78;background:#eef2ff;margin:0 3px;cursor:pointer}
select.blank-select.correct{border-color:#22c55e;background:#f0fdf4;color:#166534}
select.blank-select.wrong{border-color:#ef4444;background:#fef2f2;color:#991b1b}
.word-bank{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;padding:14px;background:#f9fafb;border-radius:10px;border:1.5px dashed #d1d5db}
.word-chip{padding:7px 14px;background:#fff;border:1.5px solid #c7d2fe;border-radius:20px;font-size:13.5px;font-weight:700;color:#1e2a78;cursor:grab}
.word-chip.used{opacity:.25;cursor:not-allowed}
.passage-result{margin-top:16px;padding:14px 16px;border-radius:10px;background:#f9fafb;border:1px solid #e5e7eb;font-size:13px;line-height:1.7}
.passage-result-item{margin-top:8px;padding-top:8px;border-top:1px solid #eee;color:#374151}
</style>
</head>

<header>
  <h1>PTE Academic Collocations</h1>

// ── GLOBALS ──────────────────────────────────
let currentMode = 'list';
let fcIndex = 0, fcData = [], fcFlipped = false;
let qData = [], qIndex = 0, qScore = 0, qWrong = 0, qStreak = 0, qBestStreak = 0, qAnswered = false;
let mqData = [], mqIndex = 0, mqScore = 0, mqWrong = 0, mqStreak = 0, mqBestStreak = 0, mqAnswered = false;
let pgIdx = 0, pgMode = 'drag', pgAnswers = [], pgOptions = [], pgBank = [], pgChecked = false;

document.getElementById('total-count').textContent = DATA.length + ' collocations';

// ── UTILITIES ────────────────────────────────
function shuffle(arr){ return [...arr].sort(()=>Math.random()-.5); }
function byCategory(cat){ return cat === -1 ? DATA : DATA.filter(d=>d[2]===cat); }
function catOptions(selected){
  let s = `<option value="-1" ${selected===-1?'selected':''}>All Categories (${DATA.length})</option>`;
  CATS.forEach((c,i)=>{
    const n = DATA.filter(d=>d[2]===i).length;
    s += `<option value="${i}" ${selected===i?'selected':''}>${c} (${n})</option>`;
  });
  return s;
}

// ── MODE SWITCH ──────────────────────────────
function switchMode(mode){
  currentMode = mode;
  const order = ['list','flash','quiz','mquiz','passage'];
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',order[i]===mode));
  order.forEach(m=>document.getElementById('mode-'+m).style.display=m===mode?'':'none');
  if(mode==='list') renderList(-1,'');
  if(mode==='flash') initFlash(-1);
  if(mode==='quiz') initQuiz(-1);
  if(mode==='mquiz') initMQuiz(-1);
  if(mode==='passage') initPassage(0);
}

// ── LIST MODE ────────────────────────────────
function renderList(cat, q){
  const pool = byCategory(cat).filter(d=>{
    const txt = (d[0]+' '+d[1]).toLowerCase();
    return txt.includes(q.toLowerCase());
  });
  const byCat = {};
  pool.forEach(d=>{ (byCat[d[2]]=byCat[d[2]]||[]).push(d); });

  let h = `<div class="controls">
    <label>Category:</label>
    <select onchange="renderList(parseInt(this.value), document.getElementById('ls-search').value)">${catOptions(cat)}</select>
    <input type="text" id="ls-search" placeholder="Search collocations…" value="${q}" oninput="renderList(parseInt(document.querySelector('#mode-list select').value), this.value)" style="max-width:280px">
    <span class="badge">${pool.length} results</span>
  </div>`;

  if(!pool.length){ h += `<div class="no-results">No collocations found. Try a different search.</div>`; }
  else {
    const cats = cat === -1 ? Object.keys(byCat).map(Number) : [cat];
    cats.forEach(ci=>{
      h += `<div class="cat-group"><div class="cat-label">${CATS[ci]}</div><div class="grid">`;
      (byCat[ci]||[]).forEach(d=>{
        h += `<div class="col-card">
          <div class="col-word"><em>${d[0]}</em> ${d[1]}</div>
          <div class="col-ex">${d[3]}</div>
        </div>`;
      });
      h += `</div></div>`;
    });
  }
  document.getElementById('mode-list').innerHTML = h;
}

// ── FLASHCARD MODE ───────────────────────────
function initFlash(cat){
  fcData = shuffle(byCategory(cat));
  fcIndex = 0; fcFlipped = false;
  renderFlash(cat);
}

function renderFlash(cat){
  const d = fcData[fcIndex];
  const el = document.getElementById('mode-flash');
  el.innerHTML = `<div class="controls">
    <label>Category:</label>
    <select onchange="initFlash(parseInt(this.value))">${catOptions(cat)}</select>
  </div>
  <div class="fc-wrap">
    <div class="fc-progress">${fcIndex+1} / ${fcData.length}</div>
    <div class="fc-card ${fcFlipped?'flipped':''}" id="fc-card" onclick="flipCard()">
      <div class="fc-front">
        <div class="word"><em>${d[0]}</em> ${d[1]}</div>
        <div class="sub">Tap to see an example sentence</div>
      </div>
      <div class="fc-back">
        <div class="fc-tag">${CATS[d[2]]}</div>
        <div class="ex">"${d[3]}"</div>
      </div>
      <div class="fc-hint">${fcFlipped?'tap to flip back':'tap to flip'}</div>
    </div>
    <div class="fc-btns">
      <button class="btn btn-secondary" onclick="fcNav(-1)">← Prev</button>
      <button class="btn btn-secondary" onclick="initFlash(parseInt(document.querySelector('#mode-flash select').value))">🔀 Shuffle</button>
      <button class="btn btn-primary" onclick="fcNav(1)">Next →</button>
    </div>
  </div>`;
}

function flipCard(){
  fcFlipped = !fcFlipped;
  const card = document.getElementById('fc-card');
  card.classList.toggle('flipped', fcFlipped);
  card.querySelector('.fc-hint').textContent = fcFlipped ? 'tap to flip back' : 'tap to flip';
}

function fcNav(dir){
  fcIndex = (fcIndex + dir + fcData.length) % fcData.length;
  fcFlipped = false;
  renderFlash(parseInt(document.querySelector('#mode-flash select').value));
}

// ── QUIZ MODE ────────────────────────────────
function initQuiz(cat){
  qData = shuffle(byCategory(cat));
  qIndex = 0; qScore = 0; qWrong = 0; qStreak = 0; qBestStreak = 0; qAnswered = false;
  renderQuiz(cat);
}

function renderQuiz(cat){
  if(qIndex >= qData.length){ renderQuizEnd(cat); return; }
  const d = qData[qIndex];
  const sameCat = DATA.filter(x=>x[2]===d[2] && x[1]!==d[1]);
  const wrongs = shuffle(sameCat).slice(0,3).map(x=>x[1]);
  while(wrongs.length < 3){ wrongs.push(['growth','change','factor','impact','rate'].find(w=>w!==d[1]&&!wrongs.includes(w))||'system'); }
  const opts = shuffle([d[1], ...wrongs.slice(0,3)]);
  const streakMsg = qStreak >= 3 ? `🔥 ${qStreak} in a row! Keep it up!` : qStreak === 2 ? `✨ 2 correct in a row!` : '';

  document.getElementById('mode-quiz').innerHTML = `
    <div class="controls">
      <label>Category:</label>
      <select onchange="initQuiz(parseInt(this.value))">${catOptions(cat)}</select>
    </div>
    <div class="quiz-stats">
      <div class="stat"><div class="stat-val">${qIndex}</div><div class="stat-lbl">Done</div></div>
      <div class="stat"><div class="stat-val correct-col">${qScore}</div><div class="stat-lbl">Correct</div></div>
      <div class="stat"><div class="stat-val wrong-col">${qWrong}</div><div class="stat-lbl">Wrong</div></div>
      <div class="stat"><div class="stat-val streak">${qStreak}</div><div class="stat-lbl">Streak 🔥</div></div>
    </div>
    <div class="streak-msg">${streakMsg}</div>
    <div class="q-card">
      <div class="q-num">Question ${qIndex+1} of ${qData.length}</div>
      <div class="q-text">Complete the collocation: <span>${d[0]}</span> ___</div>
      <div class="q-cat">${CATS[d[2]]}</div>
      <div class="options">
        ${opts.map(o=>`<button class="opt" onclick="answerQuiz('${o}','${d[1]}',this)">${o}</button>`).join('')}
      </div>
      <div class="feedback" id="feedback"></div>
      <button class="btn btn-primary next-btn" id="next-btn" style="display:none" onclick="nextQuiz(parseInt(document.querySelector('#mode-quiz select').value))">Next →</button>
    </div>`;
}

function answerQuiz(chosen, correct, btn){
  if(qAnswered) return;
  qAnswered = true;
  const d = qData[qIndex];
  const isCorrect = chosen === correct;
  if(isCorrect){ qScore++; qStreak++; if(qStreak>qBestStreak) qBestStreak=qStreak; }
  else { qWrong++; qStreak=0; }

  document.querySelectorAll('#mode-quiz .opt').forEach(b=>{
    b.disabled = true;
    if(b.textContent === correct) b.classList.add('correct');
    else if(b === btn && !isCorrect) b.classList.add('wrong');
  });

  const fb = document.getElementById('feedback');
  fb.className = 'feedback show ' + (isCorrect ? 'fc-correct' : 'fc-wrong');
  fb.innerHTML = isCorrect
    ? `<strong>✓ Correct! "${d[0]} ${d[1]}"</strong><em>${d[3]}</em>`
    : `<strong>✗ The correct answer is "${correct}"</strong>The full collocation is: <strong>${d[0]} ${correct}</strong><br><em>${d[3]}</em>`;

  document.getElementById('next-btn').style.display = 'block';
}

function nextQuiz(cat){
  qIndex++; qAnswered = false;
  renderQuiz(cat);
}

function renderQuizEnd(cat){
  const pct = Math.round(qScore/qData.length*100);
  const msg = pct===100?'Perfect score! Outstanding! 🏆':pct>=80?'Excellent work! 🌟':pct>=60?'Good effort! Keep practising 💪':'Keep going — you will get there! 📖';
  document.getElementById('mode-quiz').innerHTML = `
    <div class="controls">
      <label>Category:</label>
      <select onchange="initQuiz(parseInt(this.value))">${catOptions(cat)}</select>
    </div>
    <div class="end-screen">
      <h2>Session Complete!</h2>
      <div class="final">${qScore}/${qData.length}</div>
      <div class="final-sub">${pct}% correct · Best streak: ${qBestStreak} 🔥</div>
      <p style="margin-bottom:20px;font-size:15px;color:#374151">${msg}</p>
      <button class="btn btn-primary" onclick="initQuiz(parseInt(document.querySelector('#mode-quiz select').value))">Try Again</button>
      &nbsp;
      <button class="btn btn-secondary" onclick="switchMode('list')">Browse List</button>
    </div>`;
}

// ── PASSAGE FIB MODE ──────────────────────────
function blankMeaning(b){
  const found = DATA.find(d=>d[2]===b.cat && d[0]===b.word1 && d[1]===b.answer);
  return found ? found[4] : '';
}

function initPassage(idx){
  pgIdx = idx;
  pgChecked = false;
  const p = PASSAGES[pgIdx];
  pgAnswers = new Array(p.blanks.length).fill(null);
  pgOptions = p.blanks.map(b=>{
    const sameCat = DATA.filter(x=>x[2]===b.cat && x[1]!==b.answer);
    const wrongs = shuffle(sameCat).slice(0,3).map(x=>x[1]);
    return shuffle([b.answer, ...wrongs]);
  });
  pgBank = shuffle(p.blanks.map((b,i)=>({word:b.answer, idx:i, used:false})));
  renderPassage();
}

function passageSelector(){
  let s = '';
  PASSAGES.forEach((p,i)=>{ s += `<option value="${i}" ${i===pgIdx?'selected':''}>${i+1}. ${p.topic}</option>`; });
  return s;
}

function setPassageMode(m){
  pgMode = m;
  initPassage(pgIdx);
}

function dragStart(e, word){
  e.dataTransfer.setData('text/plain', word);
}

function dropOntoBlank(e, i){
  e.preventDefault();
  if(pgChecked) return;
  const word = e.dataTransfer.getData('text/plain');
  if(!word) return;
  if(pgAnswers[i]){
    const prev = pgBank.find(c=>c.word===pgAnswers[i] && c.used);
    if(prev) prev.used = false;
  }
  const chip = pgBank.find(c=>c.word===word && !c.used);
  if(chip) chip.used = true;
  pgAnswers[i] = word;
  renderPassage();
}

function clearBlank(i){
  if(pgChecked || !pgAnswers[i]) return;
  const chip = pgBank.find(c=>c.word===pgAnswers[i] && c.used);
  if(chip) chip.used = false;
  pgAnswers[i] = null;
  renderPassage();
}

function setPassageAnswer(i, val){
  pgAnswers[i] = val || null;
}

function checkPassage(){
  pgChecked = true;
  renderPassage();
}

function renderPassage(){
  const p = PASSAGES[pgIdx];

  const blanksHtml = p.blanks.map((b,i)=>{
    let cls = 'blank-drop';
    if(pgChecked){
      cls += (pgAnswers[i]===b.answer) ? ' correct' : ' wrong';
    } else if(pgAnswers[i]){
      cls += ' filled';
    }
    if(pgMode === 'drag'){
      const label = pgAnswers[i] || '⋯';
      const clickHandler = pgChecked ? '' : `onclick="clearBlank(${i})"`;
      return `<span class="${cls}" data-i="${i}" ondrop="dropOntoBlank(event,${i})" ondragover="event.preventDefault()" ${clickHandler}>${label}</span>`;
    } else {
      const opts = pgOptions[i].map(o=>`<option value="${o}" ${pgAnswers[i]===o?'selected':''}>${o}</option>`).join('');
      const selCls = pgChecked ? (pgAnswers[i]===b.answer?'correct':'wrong') : '';
      return `<select class="blank-select ${selCls}" ${pgChecked?'disabled':''} onchange="setPassageAnswer(${i},this.value)"><option value="">choose…</option>${opts}</select>`;
    }
  });

  let idx2 = 0;
  const text = p.text.replace(/\{(\d)\}/g, () => blanksHtml[idx2++]);

  let bankHtml = '';
  if(pgMode === 'drag'){
    bankHtml = `<div class="word-bank">` + pgBank.map(c=>
      `<span class="word-chip ${c.used?'used':''}" draggable="${!c.used}" ondragstart="dragStart(event,'${c.word.replace(/'/g,"\\'")}')">${c.word}</span>`
    ).join('') + `</div>`;
  }

  let resultHtml = '';
  if(pgChecked){
    const correctCount = p.blanks.filter((b,i)=>pgAnswers[i]===b.answer).length;
    resultHtml = `<div class="passage-result"><strong>${correctCount} / ${p.blanks.length} correct</strong>`;
    p.blanks.forEach((b,i)=>{
      if(pgAnswers[i] !== b.answer){
        resultHtml += `<div class="passage-result-item">✗ Blank ${i+1}: correct answer is "<strong>${b.word1} ${b.answer}</strong>" — ${blankMeaning(b)}</div>`;
      }
    });
    resultHtml += `</div>`;
  }

  const hint = pgMode==='drag'
    ? 'Drag each word from the bank below into the correct blank.'
    : 'Choose the correct word for each blank from the dropdown.';

  document.getElementById('mode-passage').innerHTML = `
    <div class="passage-controls">
      <label>Passage:</label>
      <select onchange="initPassage(parseInt(this.value))">${passageSelector()}</select>
      <button class="btn btn-secondary" onclick="initPassage(Math.floor(Math.random()*PASSAGES.length))">🔀 Shuffle</button>
      <div class="toggle-group">
        <button class="toggle-btn ${pgMode==='drag'?'active':''}" onclick="setPassageMode('drag')">Drag &amp; Drop</button>
        <button class="toggle-btn ${pgMode==='dropdown'?'active':''}" onclick="setPassageMode('dropdown')">Dropdown</button>
      </div>
    </div>
    <div class="passage-topic-tag">${p.topic}</div>
    <span class="passage-hint">${hint}</span>
    <div class="passage-card">${text}</div>
    ${bankHtml}
    ${resultHtml}
    <div style="margin-top:16px;display:flex;gap:10px">
      ${pgChecked
        ? `<button class="btn btn-primary" onclick="initPassage(pgIdx)">Try Again</button><button class="btn btn-secondary" onclick="initPassage((pgIdx+1)%PASSAGES.length)">Next Passage →</button>`
        : `<button class="btn btn-success" onclick="checkPassage()">Check Answers</button>`
      }
    </div>`;
}

// ── INIT ─────────────────────────────────────
renderList(-1,'');
</script>
</body>
</html>
