<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teacher Panel</title>
<link rel="stylesheet" href="style.css">
<style>
.tp{max-width:800px;margin:0 auto;padding:24px 20px 60px}
.tp h2{font-size:18px;margin:24px 0 8px}
.tp input,.tp textarea{width:100%;padding:10px;border:1px solid #ccc;border-radius:6px;font:15px system-ui;box-sizing:border-box}
.tp textarea{min-height:130px}
.tp button{background:#1e2a78;color:#fff;border:0;border-radius:6px;padding:10px 18px;font-size:15px;cursor:pointer;margin-top:8px}
.tp button.del{background:#b91c1c;padding:6px 12px;font-size:13px;margin:0}
.tp button.out{background:#6b7280;margin:0}
.tp .q{background:#fff;border:1px solid #e5e7eb;border-radius:8px;padding:12px;margin-bottom:10px;display:flex;gap:12px;justify-content:space-between;align-items:flex-start}
.tp .hint{color:#6b7280;font-size:13px;margin-top:4px}
#login{max-width:360px;margin:40px auto;background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:24px}
#panel{display:none}
.bar{display:flex;justify-content:space-between;align-items:center}
.msg{margin-top:8px;font-size:14px}
</style>
</head>
<body>
<header class="site-header"><div class="inner"><h1>Teacher Panel</h1><a class="back-link" href="index.html">← Back to Toolkit</a></div></header>
<div class="tp">

  <div id="login">
    <h2 style="margin-top:0">Teacher Login</h2>
    <input type="password" id="pw" placeholder="Teacher password" autocomplete="current-password">
    <button id="loginBtn" style="width:100%">Login</button>
    <div class="msg" id="loginMsg"></div>
  </div>

  <div id="panel">
    <div class="bar"><h2 style="margin:0">Add essay questions</h2><button class="out" id="logout">Logout</button></div>
    <textarea id="newq" placeholder="Paste the essay topic here..." style="margin-top:12px"></textarea>
    <p class="hint">To add several at once, separate them with a line containing only ---</p>
    <button id="save">Save question(s)</button>
    <div class="msg" id="msg"></div>

    <h2>Saved questions (<span id="count">0</span>)</h2>
    <div id="list"></div>

    <h2 style="margin-top:36px">Students</h2>
    <p class="hint">Create one account per student. Give them their username and password yourself.</p>
    <input id="sn" placeholder="Student's full name" style="margin-top:8px">
    <input id="su" placeholder="Username (e.g. ram.k)" style="margin-top:8px" autocapitalize="off">
    <input id="sp" placeholder="Password (at least 6 characters)" style="margin-top:8px">
    <button id="screate">Create student account</button>
    <div class="msg" id="smsg"></div>
    <h2>All students (<span id="scount">0</span>)</h2>
    <div id="slist"></div>
    <div id="shist"></div>
  </div>
</div>
<script src="fbview.js"></script>
<script>
const $ = id => document.getElementById(id);
let pass = '';

function say(el, t, ok) { $(el).textContent = t; $(el).style.color = ok ? '#15803d' : '#b91c1c'; }

function render(qs) {
  $('count').textContent = qs.length;
  $('list').innerHTML = '';
  qs.forEach(q => {
    const d = document.createElement('div'); d.className = 'q';
    const p = document.createElement('div'); p.textContent = q.text;
    const b = document.createElement('button'); b.className = 'del'; b.textContent = 'Delete';
    b.onclick = () => { if (confirm('Delete this question?')) call('DELETE', '?id=' + encodeURIComponent(q.id)); };
    d.append(p, b); $('list').append(d);
  });
}

async function call(method, query = '', body) {
  const r = await fetch('/api/questions' + query, {
    method,
    headers: { 'Content-Type': 'application/json', 'x-teacher-password': pass },
    body: body ? JSON.stringify(body) : undefined
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) { say('msg', data.error || 'Something went wrong', false); return null; }
  if (data.questions) render(data.questions);
  say('msg', 'Saved.', true);
  return data;
}

async function login(p, silent) {
  try {
    const r = await fetch('/api/questions?auth=1', { headers: { 'x-teacher-password': p } });
    if (!r.ok) {
      if (!silent) {
        const d = await r.json().catch(() => ({}));
        let m = d.error || ('Server problem (error ' + r.status + ').');
        if (r.status === 404) m = 'Error 404: the api folder was not deployed. Check that api/questions.js is in your repo.';
        say('loginMsg', m, false);
      }
      return;
    }
  } catch (e) { if (!silent) say('loginMsg', 'Could not reach the server.', false); return; }
  pass = p; sessionStorage.setItem('tpw', p);
  $('login').style.display = 'none'; $('panel').style.display = 'block';
  const d = await fetch('/api/questions').then(r => r.json()).catch(() => ({}));
  if (d.error) say('msg', 'Logged in, but the database says: ' + d.error, false);
  render(d.questions || []);
  loadStudents();
}

$('loginBtn').onclick = () => login($('pw').value, false);
$('pw').addEventListener('keydown', e => { if (e.key === 'Enter') login($('pw').value, false); });
$('logout').onclick = () => { sessionStorage.removeItem('tpw'); location.reload(); };
$('save').onclick = async () => {
  const texts = $('newq').value.split(/\n\s*---\s*\n/).map(t => t.trim()).filter(Boolean);
  if (!texts.length) return say('msg', 'Type a question first.', false);
  if (await call('POST', '', { texts })) $('newq').value = '';
};


/* ---------- students ---------- */
async function tcall(method, query, body) {
  const r = await fetch('/api/students' + (query || ''), { method, headers: { 'Content-Type': 'application/json', 'x-teacher-password': pass }, body: body ? JSON.stringify(body) : undefined });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { say('smsg', d.error || 'Something went wrong', false); return null; }
  return d;
}
const fmt = iso => iso ? new Date(iso).toLocaleString([], { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : 'never';
async function loadStudents() {
  const d = await tcall('GET'); if (!d) return;
  $('scount').textContent = d.students.length; $('slist').innerHTML = '';
  d.students.forEach(s => {
    const row = document.createElement('div'); row.className = 'q';
    const info = document.createElement('div');
    info.innerHTML = '<b></b> <small></small><br><small>Essays: ' + s.attempts + ' · Last active: ' + fmt(s.last) + '</small>';
    info.querySelector('b').textContent = s.name; info.querySelector('small').textContent = '(' + s.username + ')';
    const box = document.createElement('div'); box.style.cssText = 'display:flex;gap:6px;flex-wrap:wrap';
    const mk = (t, cls, fn) => { const b = document.createElement('button'); b.textContent = t; b.className = cls; b.style.margin = 0; b.onclick = fn; box.append(b); };
    mk('History', '', () => showHist(s));
    mk('Reset password', 'out', async () => { const p = prompt('New password for ' + s.username + ' (min 6 characters):'); if (p && await tcall('PUT', '', { username: s.username, password: p })) say('smsg', 'Password changed for ' + s.username + '. Their old login is now invalid.', true); });
    mk('Delete', 'del', async () => { if (confirm('Delete ' + s.name + ' and ALL their saved history? This cannot be undone.') && await tcall('DELETE', '?username=' + encodeURIComponent(s.username))) { $('shist').innerHTML = ''; loadStudents(); } });
    row.append(info, box); $('slist').append(row);
  });
}
async function showHist(s) {
  const r = await fetch('/api/history?username=' + encodeURIComponent(s.username), { headers: { 'x-teacher-password': pass } });
  const d = await r.json(); const box = $('shist');
  box.innerHTML = '<h2>History: ' + escHtml(s.name) + '</h2>';
  if (!d.attempts || !d.attempts.length) { box.innerHTML += '<p>No essays yet.</p>'; return; }
  d.attempts.forEach(a => {
    const row = document.createElement('div'); row.className = 'q'; row.style.cursor = 'pointer';
    row.innerHTML = '<div><b>' + a.overall + ' / 90</b> &nbsp; <small>' + fmt(a.date) + ' · ' + a.words + ' words</small><br>' + escHtml(a.question) + '</div>';
    const det = document.createElement('div'); det.style.width = '100%';
    row.style.flexWrap = 'wrap'; row.append(det);
    row.onclick = async () => {
      if (det.innerHTML) { det.innerHTML = ''; return; }
      const x = await (await fetch('/api/history?username=' + encodeURIComponent(s.username) + '&id=' + a.id, { headers: { 'x-teacher-password': pass } })).json();
      det.innerHTML = '<p><b>Essay:</b></p><pre style="white-space:pre-wrap;font:14px system-ui">' + escHtml(x.attempt.essay) + '</pre>' + renderFeedback(x.attempt.feedback);
    };
    box.append(row);
  });
  box.scrollIntoView({ behavior: 'smooth' });
}
$('screate').onclick = async () => {
  const d = await tcall('POST', '', { name: $('sn').value, username: $('su').value, password: $('sp').value });
  if (d) { say('smsg', 'Account created. Username: ' + $('su').value.trim().toLowerCase() + ' / Password: ' + $('sp').value, true); $('sn').value = $('su').value = $('sp').value = ''; loadStudents(); }
};

const saved = sessionStorage.getItem('tpw');
if (saved) login(saved, true);
</script>
</body>
</html>
